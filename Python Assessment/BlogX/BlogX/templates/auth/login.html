{% extends 'base.html' %}
{% block title %}Login | WriteSphere{% endblock %}
{% block content %}
<section class="split-layout">
    <div class="panel form-panel">
        <h1>Welcome back</h1>
        <p>Login to continue writing and reading amazing stories.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn">Login</button>
        </form>
        <p>New here? <a href="{% url 'register' %}">Create account</a></p>
    </div>
    <div class="panel image-panel">
        <div class="placeholder">
            <h2>Write. Share. Grow.</h2>
        </div>
    </div>
</section>
{% endblock %}
