{% extends "base.html" %}
{% block title %}Delete Comment | WriteSphere{% endblock %}
{% block content %}
<section class="card">
    <h2>Delete Comment</h2>
    <p>Are you sure you want to delete this comment?</p>
    <blockquote style="border-left: 4px solid #e5e7eb; margin: 0 0 12px; padding: 8px 12px;">
        {{ comment.content }}
    </blockquote>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Delete Comment</button>
        <a href="{% url 'post_detail' comment.post.pk %}" class="btn">Cancel</a>
    </form>
</section>
{% endblock %}
