{% extends "base.html" %}
{% block title %}Edit Comment | WriteSphere{% endblock %}
{% block content %}
<section class="card">
    <h2>Edit Comment</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Update Comment</button>
    </form>
    <p style="margin-top: 10px;">
        <a href="{% url 'post_detail' comment.post.pk %}">Back to post</a>
    </p>
</section>
{% endblock %}
